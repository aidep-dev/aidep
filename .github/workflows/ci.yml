name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aidep
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5433/aidep
      # the default is a sibling checkout (../aidep-registry), which only exists
      # in local dev; on CI read the same raw URL production reads
      REGISTRY_SOURCE: https://raw.githubusercontent.com/aidep-dev/aidep-registry/master/registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next-env.d.ts and .next/types are gitignored, so the generated
      # route and layout types are absent on a fresh checkout
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # the published CLI: build it and run it the way a stranger would, with
      # no sibling registry checkout and no REGISTRY_SOURCE
      - run: npm run build:cli
      - run: env -u REGISTRY_SOURCE node cli/dist/cli/scan.js test/fixtures/fixture-repo
